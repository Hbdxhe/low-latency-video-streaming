# sclient_tcp.conf
#
# 真实摄像头 + TCP 联调配置。
# 典型启动方式：
#   cd sserver && ./build/stream_server --config config/sclient_tcp.conf
#   cd sclient && ./build/sclient --host 127.0.0.1 --port 19099 --transport tcp --metadata on
#
# TCP 特点：可靠、有序、易于理解；但网络丢包时可能因为重传产生队头阻塞。

# 应用名只用于日志标识，方便区分不同运行场景。
app.name = sserver-sclient-tcp

# 进程退出和日志统计配置。
# latency_log_interval_frames = 60 表示每 60 帧输出一次服务端延迟/队列统计。
runtime.shutdown_grace_period_ms = 100
runtime.latency_log_interval_frames = 60

# 采集配置：使用真实 Linux 摄像头 /dev/video0。
# 如果你的摄像头在 /dev/video1，需要改 capture.device。
capture.enabled = true
capture.source = v4l2
capture.device = /dev/video0
capture.width = 640
capture.height = 480
capture.fps = 30

# frame_interval_ms = 0 表示不额外人为 sleep，采集节奏由摄像头/fps 控制。
capture.frame_interval_ms = 0

# V4L2 内核缓冲区数量。2 个缓冲是偏低延迟的设置。
capture.device_buffer_count = 2

# 传输配置：TCP 服务端监听 127.0.0.1:19099，等待 sclient 主动连接。
transport.enabled = true
transport.backend = tcp
transport.bind_address = 127.0.0.1
transport.listen_port = 19099

# 每个客户端最多积压 2 帧。积压太多会增加延迟，所以这里保持很小。
transport.max_pending_frames = 2

# accept 循环等待时间，越小连接响应越快。
transport.accept_loop_interval_ms = 1

# TCP_NODELAY=true 表示禁用 Nagle 算法，减少小包合并等待，偏低延迟。
transport.enable_nodelay = true

# 把采集/编码/发送时间戳嵌入码流，客户端 HUD 才能显示端到端延迟。
transport.embed_frame_metadata = true

# 以下 UDP 配置在 TCP 模式下基本不会被使用，保留是为了配置结构统一。
transport.udp_client_timeout_ms = 10000
transport.udp_max_datagram_size = 65507
transport.udp_target_payload_size = 1200
transport.udp_receive_buffer_bytes = 4194304
transport.udp_send_buffer_bytes = 4194304

# 编码配置：使用 x264 把摄像头原始帧压缩成 H.264。
codec.backend = x264

# ultrafast + zerolatency 是实时低延迟常见组合：编码快，压缩率相对低一些。
codec.x264_preset = ultrafast
codec.x264_tune = zerolatency

# baseline 兼容性好，适合低复杂度实时传输。
codec.x264_profile = baseline

# Annex-B 输出便于 RTP/UDP/TCP 传输时按 NALU 处理。
codec.x264_annexb = true

# 重复 SPS/PPS，让客户端中途加入时更容易等到解码参数。
codec.x264_repeat_headers = true

# 每 10 帧一个关键帧上限/下限。关键帧更频繁，客户端恢复更快，但码率更高。
codec.x264_keyint_max = 10
codec.x264_keyint_min = 10

# 低延迟场景禁用 B 帧，避免帧重排序带来的等待。
codec.x264_bframes = 0

# 单线程 + sliced threads：减少排队，保持低延迟。
codec.x264_threads = 1
codec.x264_sliced_threads = true
codec.x264_slice_count = 1
codec.x264_slice_count_max = 1

# 低延迟编码常用较少参考帧、关闭 lookahead/mbtree/scenecut。
codec.x264_frame_reference = 1
codec.x264_lookahead = 0
codec.x264_sync_lookahead = 0
codec.x264_subpel_refine = 0
codec.x264_mb_tree = false
codec.x264_scenecut = 0
