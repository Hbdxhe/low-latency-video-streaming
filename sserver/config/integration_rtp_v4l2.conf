# integration_rtp_v4l2.conf
#
# 真实摄像头 + RTP 推流配置。
# 典型启动顺序：
#   1. cd sclient && bash scripts/rtp.sh v4l2
#   2. cd sserver && bash scripts/rtp.sh v4l2
#
# RTP 模式和 TCP/UDP 自定义模式不同：
#   TCP/UDP：服务端监听，客户端主动连接/注册
#   RTP    ：服务端主动把 RTP 包推送到 rtp_remote_host:rtp_remote_port

app.name = sserver-integration-rtp-v4l2
runtime.shutdown_grace_period_ms = 100

# RTP integration 配置日志更密，每 20 帧打印一次，方便联调观察。
runtime.latency_log_interval_frames = 20

# 采集真实摄像头。
capture.enabled = true
capture.source = v4l2
capture.device = /dev/video0
capture.width = 640
capture.height = 480
capture.fps = 30
capture.frame_interval_ms = 0
capture.device_buffer_count = 2

# 选择 RTP 后端。
transport.enabled = true
transport.backend = rtp

# RTP 是主动推流，不依赖 listen_port 对客户端建立连接。
# bind_address/listen_port 仍保留在统一配置结构里。
transport.bind_address = 127.0.0.1
transport.listen_port = 0
transport.max_pending_frames = 2
transport.accept_loop_interval_ms = 1
transport.enable_nodelay = true

# RTP 模式不把 metadata 嵌入普通帧头，而是通过 RTP latency extension 携带时间戳。
transport.embed_frame_metadata = false
transport.udp_client_timeout_ms = 5000
transport.udp_max_datagram_size = 65507
transport.udp_target_payload_size = 1200
transport.udp_receive_buffer_bytes = 4194304
transport.udp_send_buffer_bytes = 4194304

# RTP 远端地址和端口。sclient/scripts/rtp.sh v4l2 默认监听 127.0.0.1:19514。
transport.rtp_remote_host = 127.0.0.1
transport.rtp_remote_port = 19514

# payload_type=96 是动态 RTP payload type，常用于 H.264。
transport.rtp_payload_type = 96

# H.264 RTP 标准时钟通常使用 90000 Hz。
transport.rtp_clock_rate = 90000

# SSRC 用来标识 RTP 流的同步源。
transport.rtp_ssrc = 305419897

# RTP 单包 H.264 payload 上限。超过后大 NALU 会被拆成 FU-A 分片。
transport.rtp_max_payload_size = 1200

# 生成 SDP 文件，给 ffplay 或其他播放器描述 RTP 流参数。
transport.rtp_sdp_path = rtp_v4l2_test.sdp

# 编码配置：仍使用低延迟 x264/H.264。
codec.backend = x264
codec.x264_preset = ultrafast
codec.x264_tune = zerolatency
codec.x264_profile = baseline
codec.x264_annexb = true
codec.x264_repeat_headers = true
codec.x264_keyint_max = 10
codec.x264_keyint_min = 10
codec.x264_bframes = 0
codec.x264_threads = 1
codec.x264_sliced_threads = true
codec.x264_slice_count = 1
codec.x264_slice_count_max = 1
codec.x264_frame_reference = 1
codec.x264_lookahead = 0
codec.x264_sync_lookahead = 0
codec.x264_subpel_refine = 0
codec.x264_mb_tree = false
codec.x264_scenecut = 0
